<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Thank You | SHIVARA</title>
<link rel="icon" href="/logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#14343f;--muted:#5d777d;--teal:#3fa8a0;--line:#e0eeec;--card:#f3faf9}
@media(prefers-color-scheme:dark){:root{--bg:#0b181d;--ink:#e8f3f2;--muted:#8fabae;--line:#1f3a41;--card:#12262d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Poppins,system-ui,sans-serif}
header{border-bottom:1px solid var(--line)}.wrap{max-width:1120px;margin:auto;padding:0 24px}
header .wrap{height:76px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-weight:600;letter-spacing:.2em}
.brand img{height:38px;width:38px;object-fit:contain;border-radius:9px}
main{min-height:calc(100svh - 160px);display:grid;place-items:center;padding:60px 24px}
.card{max-width:650px;width:100%;padding:clamp(30px,6vw,64px);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.05)}
.check{display:grid;place-items:center;margin:0 auto 24px;width:72px;height:72px;border-radius:50%;background:rgba(63,168,160,.14);color:var(--teal)}
h1{font-size:clamp(27px,4vw,39px);line-height:1.25;margin:0 0 18px;letter-spacing:-.035em}
p{color:var(--muted);margin:0 0 32px}.btn{display:inline-block;background:var(--teal);color:#fff;padding:13px 30px;border-radius:100px;text-decoration:none;font-weight:600;transition:transform .2s,filter .2s}.btn:hover{transform:translateY(-2px);filter:brightness(.92)}
footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;padding:22px}
</style>
<script>
(function(){
  try {
    var token=sessionStorage.getItem('shivara_lead_submitted');
    if(!token){location.replace('/');return;}
    sessionStorage.removeItem('shivara_lead_submitted');
  } catch(e) { location.replace('/'); }
})();
</script>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><img src="/logo.jpeg" alt="">SHIVARA</a></div></header>
<main><section class="card" aria-labelledby="thanks"><div class="check" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div><h1 id="thanks">Thank You for Choosing SHIVARA!</h1><p>Your enquiry has been successfully submitted. Our team will review your requirements and get back to you soon.</p><a class="btn" href="/">Back to Home</a></section></main>
<footer>© 2026 SHIVARA. All Rights Reserved.</footer>
</body></html>
